name = "qid-quotes"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "QIDQUOTES"
id = "6e64477059ae419e9ecfff8c8f0abdf1"

[vars]
IMGUR_CLIENT_ID = "f7029afd615bd8f"

# All sensitive values are stored as Wrangler secrets (never committed).
# Run these once after deploying:
#
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put REPLICATE_API_TOKEN
#   wrangler secret put GOOGLE_SHEETS_ID
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_EMAIL
#   wrangler secret put GOOGLE_PRIVATE_KEY
#   wrangler secret put GOOGLE_PHOTOS_CLIENT_ID
#   wrangler secret put GOOGLE_PHOTOS_CLIENT_SECRET
#   wrangler secret put GOOGLE_PHOTOS_REFRESH_TOKEN
#   wrangler secret put GOOGLE_PHOTOS_ALBUM_ID
#
# GOOGLE_PRIVATE_KEY: paste the full PEM block when prompted.
# Wrangler stores newlines as \n — the worker converts them back.
#
# Children, birthdays, and reference photo URLs are managed in the
# "names" tab of the Google Sheet (columns: Name | Birthday MM/DD/YYYY | Photo URL 1 | Photo URL 2 | ...)
